services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: inventory_db
      POSTGRES_USER: inventory_user
      POSTGRES_PASSWORD: Knightrider2005
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data  
    ports:
      - "5432:5432"
    restart: unless-stopped

  backend:
    build: ./IMS Backend
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://inventory_user:Knightrider2005@db:5432/inventory_db
      JWT_SECRET: mysupersecrehjsdjhktkeyforjsonwebtoken12345!@#
      PORT: 3000
    ports:
      - "3000:3000"
    restart: unless-stopped

  frontend:
    build: ./IMS
    depends_on:
      - backend
    ports:
      - "80:80"
    environment:
      - VITE_API_URL=http://localhost:3000
    restart: unless-stopped

volumes:
  postgres_data:  