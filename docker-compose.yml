version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: ims-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-inventory_db}
      POSTGRES_USER: ${DB_USER:-inventory_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-CharlySays}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./initdevelop.sql:/docker-entrypoint-initdb.d/initdevelop.sql
    networks:
      - ims-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-inventory_user} -d ${DB_NAME:-inventory_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend (Node.js)
  backend:
    build:
      context: ./IMS Backend
      dockerfile: Dockerfile
    container_name: ims-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-inventory_db}
      DB_USER: ${DB_USER:-inventory_user}
      DB_PASSWORD: ${DB_PASSWORD:-CharlySays}
      JWT_SECRET: ${JWT_SECRET:-mysupersecrehjsdjhktkeyforjsonwebtoken12345!@#}
      PORT: 3000
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - backend_uploads:/app/uploads
    networks:
      - ims-network

  # Frontend (React + Nginx)
  frontend:
    build:
      context: ./IMS
      dockerfile: Dockerfile
    container_name: ims-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    volumes:
      - backend_uploads:/usr/share/nginx/html/uploads:ro  # <-- Фронтенд читает отсюда (ro = read
    networks:
      - ims-network
volumes:
  postgres_data:
    driver: local
  backend_uploads:
    driver: local

networks:
  ims-network:
    driver: bridge